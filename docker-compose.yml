services:
  postgres:
    image: postgres:16-alpine
    container_name: english-learning-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner_password
      POSTGRES_DB: english_learning_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
